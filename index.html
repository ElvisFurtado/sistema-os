<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de OS - Assistência Técnica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.furtado.jpeg" alt="Logo Furtado" class="logo">
        <h1>Abertura de Ordem de Serviço</h1>
        <p>Registro de equipamentos para montagem e manutenção</p>
    </header>
    <main>
        <form id="form-os">
            <fieldset>
                <legend>Dados do Cliente</legend>
                <label for="nomeCliente">Nome do Cliente:</label>
                <input type="text" id="nomeCliente" name="nomeCliente" required placeholder="Ex: João da Silva">
                <label for="contatoCliente">Contato (Instagram / WhatsApp):</label>
                <input type="text" id="contatoCliente" name="contatoCliente" required placeholder="Ex: @cliente ou (19) 99999-9999">
            </fieldset>
            <fieldset>
                <legend>Informações do Equipamento</legend>
                <label for="tipoEquipamento">Tipo de Equipamento:</label>
                <select id="tipoEquipamento" name="tipoEquipamento" required>
                    <option value="" disabled selected>Selecionar...</option>
                    <option value="notebook">Notebook</option>
                    <option value="desktop">Computador de Mesa (PC Gamer/Custom)</option>
                    <option value="impressora">Impressora</option>
                    <option value="smartphone">Smartphone</option>
                </select>
                <label for="modeloEquipamento">Marca e Modelo:</label>
                <input type="text" id="modeloEquipamento" name="modeloEquipamento" required placeholder="Ex: ASUS Vivobook 16X, Lenovo IdeaPad...">
                <label for="especificacoes">Especificações / Componentes (Opcional):</label>
                <textarea id="especificacoes" name="especificacoes" rows="2" placeholder="Ex: 24GB de RAM física, tela de 40 pinos, etc."></textarea>
            </fieldset>
            <fieldset>
                <legend>Detalhes do Serviço</legend>
                <label for="tipoServico">Serviço Desejado:</label>
                <select id="tipoServico" name="tipoServico" required>
                    <option value="montagem">Montagem Personalizada</option>
                    <option value="manutencao_preventiva">Limpeza e Manutenção Preventiva</option>
                    <option value="reparo_placa">Reparo de Hardware</option>
                    <option value="troca_peca">Upgrade / Troca de Peça</option>
                    <option value="diagnostico">Diagnóstico</option>
                </select>
                <label for="descricaoProblema">Descrição do Problema ou Projeto:</label>
                <textarea id="descricaoProblema" name="descricaoProblema" rows="4" required placeholder="Descreva o defeito relatado ou as peças desejadas na montagem..."></textarea>
            </fieldset>
            <button type="submit">Salvar Ordem de Serviço</button>
        </form>
    </main>
    <script type="module" src="script.js"></script>
    
    <div style="text-align: center; margin-top: 20px;">
        <a href="login.html" style="color: #475569; text-decoration: none; font-size: 0.8rem; font-weight: 500;">Área do Técnico</a>
    </div>
</body>
</html>
